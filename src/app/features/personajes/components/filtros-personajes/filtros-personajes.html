<section class="mb-6 grid gap-4 rounded-xl border border-stone-200 bg-white p-4 sm:grid-cols-2 lg:grid-cols-4">
  <label class="flex flex-col gap-1 text-sm text-stone-700 sm:col-span-2">
    Nombre
    <input
      class="campo w-full"
      type="search"
      [value]="texto()"
      (input)="cambiarTexto($event)"
      placeholder="Buscar personaje..."
    />
  </label>

  <label class="flex flex-col gap-1 text-sm text-stone-700">
    Raza
    <select class="campo w-full" [value]="raza()" (change)="cambiarRaza($event)">
      <option value="todas">Todas</option>
      @for (opcion of razas(); track opcion) {
        <option [value]="opcion">{{ opcion }}</option>
      }
    </select>
  </label>

  <label class="flex flex-col gap-1 text-sm text-stone-700">
    Género
    <select class="campo w-full" [value]="genero()" (change)="cambiarGenero($event)">
      <option value="">Todos</option>
      <option value="Male">Masculino</option>
      <option value="Female">Femenino</option>
      <option value="Unknown">Desconocido</option>
    </select>
  </label>
</section>
