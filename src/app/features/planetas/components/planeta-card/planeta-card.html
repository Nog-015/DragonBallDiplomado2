@let p = planeta();

<article class="flex h-full flex-col overflow-hidden rounded-xl border border-stone-200 bg-white shadow-sm">
  <div class="flex h-48 items-center justify-center bg-linear-to-b from-ki-100 to-ki-50 p-4">
    @if (imagenFallo()) {
      <svg lucideImageOff class="size-12 text-stone-400"></svg>
    } @else {
      <img [src]="p.image" [alt]="p.name" loading="lazy" (error)="imagenFallo.set(true)" class="max-h-full max-w-full object-contain" />
    }
  </div>

  <div class="flex flex-1 flex-col gap-2 p-4">
    <div class="flex items-start justify-between gap-2">
      <h3 class="text-lg font-semibold leading-tight">{{ p.name }}</h3>
      @if (p.isDestroyed) {
        <span class="rounded-full bg-red-600 px-2 py-0.5 text-xs font-medium text-white">Destruido</span>
      }
    </div>
    <p class="line-clamp-4 text-sm text-stone-600">{{ p.description }}</p>
  </div>
</article>
